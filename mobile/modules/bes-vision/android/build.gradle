plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ginslayer.besvision'
version = '0.1.0'

android {
  namespace "expo.modules.besvision"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
}

// Same override as expo-camera: CameraX needs the real listenablefuture:1.0,
// not Guava's empty 9999.0 placeholder pulled in by React Native.
configurations.configureEach {
  resolutionStrategy.force "com.google.guava:listenablefuture:1.0"
}

dependencies {
  // Must match expo-camera's CameraX version — both share the process-wide
  // ProcessCameraProvider.
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"

  // LiteRT (formerly TensorFlow Lite) classic Interpreter API. 16 KB page
  // aligned on all ABIs.
  implementation "com.google.ai.edge.litert:litert:1.4.2"
}
